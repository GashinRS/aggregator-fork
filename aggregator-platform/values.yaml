loglevel: info

auth:
  oidc: {}
  client_credentials: {}
  provision: {}

spec:
  service_collection: /services
  transformation_catalog: /transformations
  registration: /registration

transformations: []

server:
  replicaCount: 1

  image:
    repository: aggregator-server
    tag: latest
    pullPolicy: Never
  
  readinessProbe:
    initialDelaySeconds: 2
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

ingressUma:
  replicaCount: 1

  image:
    repository: ingress-uma
    tag: latest
    pullPolicy: Never

  disableAuth: false

  readinessProbe:
    initialDelaySeconds: 2
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  
  terminationGracePeriodSeconds: 50

tokenService:
  replicaCount: 1

  image:
    repository: token-service
    tag: latest
    pullPolicy: Never

  readinessProbe:
    initialDelaySeconds: 2
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  
  terminationGracePeriodSeconds: 60

tls:
  enabled: false

trust:
  ca:
    enabled: false
    create: true
    configMapName: pacsoi-ca
    key: ca.crt
    mountPath: /etc/ssl/pacsoi-ca
    bundle: ""

ingressClassName: ""
